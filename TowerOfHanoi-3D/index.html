<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tower of Hanoi 3D | Kids Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <!-- Game Header -->
        <header class="game-header">
            <h1>TOWER OF HANOI 🎮</h1>
            <div class="controls">
                <div class="disk-control">
                    <label>Disks (3-8):</label>
                    <input type="range" id="diskSlider" min="3" max="8" value="5">
                    <span id="diskCount">5</span>
                </div>
                <div class="moves-display">Moves: <span id="moveCount">0</span></div>
            </div>
            <div class="buttons">
                <button id="resetBtn">Reset Game</button>
                <button id="autoSolveBtn">Auto Solve</button>
            </div>
        </header>

        <!-- 3D Game Board -->
        <div class="game-board">
            <div class="peg" data-peg="0"></div>
            <div class="peg" data-peg="1"></div>
            <div class="peg" data-peg="2"></div>
        </div>

        <!-- Warning & Victory Messages -->
        <div id="warning" class="warning hidden">⚠️ Cannot place larger disk on smaller one!</div>
        <div id="victory" class="victory hidden">🎉 YOU WIN! Perfect Puzzle Solver!</div>
    </div>

    <script src="script.js"></script>
</body>
</html>
